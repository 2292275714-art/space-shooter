<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太空射击 - 增强版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    color: #fff;
    user-select: none;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 6px;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #4fc3f7, #e040fb, #4fc3f7);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 4s linear infinite;
  }
  @keyframes shimmer { to { background-position: 200% 0; } }
  #gameWrap { position: relative; }
  canvas {
    display: block;
    background: #0d1226;
    border: 2px solid #2a3a6a;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(79, 195, 247, 0.25);
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5, 8, 20, 0.85);
    border-radius: 8px;
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 34px; margin-bottom: 14px; letter-spacing: 4px; }
  .overlay p { color: #9aa7c8; margin: 6px 0; font-size: 15px; line-height: 1.7; }
  .overlay .tip { color: #5f6d94; font-size: 13px; }
  .btn {
    margin-top: 18px;
    padding: 12px 40px;
    font-size: 18px;
    letter-spacing: 3px;
    color: #fff;
    background: linear-gradient(135deg, #4fc3f7, #7c4dff);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 18px rgba(79, 195, 247, 0.7); }
  .legend { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: #aab6d8; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .chip { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
</style>
</head>
<body>
<h1>太 空 射 击</h1>
<div id="gameWrap">
  <canvas id="game" width="800" height="600"></canvas>

  <!-- 开始界面 -->
  <div class="overlay" id="startScreen">
    <h2>🚀 太空射击</h2>
    <p>消灭入侵的敌机，收集道具，击败 Boss！</p>
    <div class="legend">
      <span><i class="chip" style="background:#4fc3f7"></i> ←→/AD 移动</span>
      <span><i class="chip" style="background:#ffd54f"></i> 空格 射击</span>
      <span><i class="chip" style="background:#ef5350"></i> 炸弹 X（清屏）</span>
      <span><i class="chip" style="background:#66bb6a"></i> P 暂停</span>
    </div>
    <button class="btn" id="startBtn">开 始 游 戏</button>
  </div>

  <!-- 暂停界面 -->
  <div class="overlay hidden" id="pauseScreen">
    <h2>⏸ 已暂停</h2>
    <p>按 P 或点击按钮继续</p>
    <button class="btn" id="resumeBtn">继 续</button>
  </div>

  <!-- 结束界面 -->
  <div class="overlay hidden" id="gameOverScreen">
    <h2>💥 游戏结束</h2>
    <p id="finalScore">得分：0</p>
    <p id="finalWave">波次：1</p>
    <button class="btn" id="restartBtn">再 来 一 局</button>
  </div>
</div>

<script>
'use strict';

// ============ 基础设置 ============
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const startScreen = document.getElementById('startScreen');
const pauseScreen = document.getElementById('pauseScreen');
const gameOverScreen = document.getElementById('gameOverScreen');

// ============ 游戏状态 ============
const STATE = { MENU: 0, PLAYING: 1, PAUSED: 2, OVER: 3 };
let state = STATE.MENU;

let player, bullets, enemyBullets, enemies, particles, powerups, stars;
let score, wave, lives, spawnTimer, waveTimer, bossActive, shake, autoFire;
let keys = {};

// ============ 音效（Web Audio API 合成，无需外部文件） ============
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, dur, type = 'square', vol = 0.15, slide = 0) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), audioCtx.currentTime + dur);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}
const sfx = {
  shoot: () => playTone(880, 0.08, 'square', 0.05, -400),
  hit:   () => playTone(200, 0.12, 'sawtooth', 0.12, -120),
  boom:  () => playTone(120, 0.35, 'sawtooth', 0.18, -80),
  power: () => { playTone(600, 0.1, 'sine', 0.12); setTimeout(() => playTone(900, 0.12, 'sine', 0.12), 90); },
  boss:  () => { playTone(80, 0.6, 'sawtooth', 0.2, -30); setTimeout(() => playTone(60, 0.8, 'sawtooth', 0.18, -20), 250); },
  hurt:  () => playTone(300, 0.2, 'triangle', 0.15, -150),
  enemyShoot: () => playTone(400, 0.06, 'triangle', 0.04, -100),
};

// ============ 工具函数 ============
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function dist(x1, y1, x2, y2) { return Math.hypot(x1 - x2, y1 - y2); }
function circleHit(a, b) { return dist(a.x, a.y, b.x, b.y) < a.r + b.r; }

// ============ 星空背景 ============
function initStars() {
  stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({ x: rand(0, W), y: rand(0, H), s: rand(0.5, 2.5), v: rand(0.3, 1.6) });
  }
}

// ============ 初始化游戏 ============
function resetGame() {
  player = {
    x: W / 2, y: H - 70, r: 16, speed: 6.5,
    lives: 3, fireRate: 200, fireCd: 0, triple: 0, tripleT: 0,
    shield: 0, invuln: 0, bomb: 1,
  };
  bullets = [];
  enemyBullets = [];
  enemies = [];
  particles = [];
  powerups = [];
  score = 0;
  wave = 1;
  lives = 3;
  spawnTimer = 0;
  waveTimer = 0;
  bossActive = false;
  shake = 0;
  autoFire = true;
  initStars();
}

// ============ 输入 ============
document.addEventListener('keydown', (e) => {
  const code = e.code;
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(code)) e.preventDefault();
  keys[code] = true;

  if (code === 'KeyP') {
    if (state === STATE.PLAYING) pauseGame();
    else if (state === STATE.PAUSED) resumeGame();
  }
  if (code === 'KeyX' && state === STATE.PLAYING) useBomb();
  if (code === 'Space' && state === STATE.MENU) startGame();
  if (code === 'Space' && state === STATE.OVER) startGame();
});
document.addEventListener('keyup', (e) => { keys[e.code] = false; });

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('resumeBtn').addEventListener('click', resumeGame);
document.getElementById('restartBtn').addEventListener('click', startGame);
canvas.addEventListener('click', () => { if (state === STATE.MENU) startGame(); });

function startGame() {
  initAudio();
  resetGame();
  state = STATE.PLAYING;
  startScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  pauseScreen.classList.add('hidden');
}
function pauseGame() {
  state = STATE.PAUSED;
  pauseScreen.classList.remove('hidden');
}
function resumeGame() {
  state = STATE.PLAYING;
  pauseScreen.classList.add('hidden');
}
function gameOver() {
  state = STATE.OVER;
  document.getElementById('finalScore').textContent = '得分：' + score;
  document.getElementById('finalWave').textContent = '波次：' + wave;
  gameOverScreen.classList.remove('hidden');
}

// ============ 炸弹（清屏） ============
function useBomb() {
  if (player.bomb <= 0) return;
  player.bomb--;
  sfx.boom();
  shake = 14;
  for (const e of enemies) {
    if (!e.isBoss) { score += e.score; spawnExplosion(e.x, e.y, e.color); }
    else { e.hp -= 40; score += 40; }
  }
  enemies = enemies.filter(e => e.isBoss || e.hp <= 0);
  // 同时清除敌方子弹
  for (const b of enemyBullets) spawnParticle(b.x, b.y, '#ff5252', 2, 0.4);
  enemyBullets.length = 0;
}

// ============ 粒子特效 ============
function spawnExplosion(x, y, color) {
  for (let i = 0; i < 22; i++) {
    particles.push({
      x, y, vx: rand(-4, 4), vy: rand(-4, 4),
      life: rand(0.3, 0.7), maxLife: 0.7,
      r: rand(2, 5), color,
    });
  }
}
function spawnParticle(x, y, color, n = 6, life = 0.5) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y, vx: rand(-2, 2), vy: rand(-2, 2),
      life: rand(0.2, life), maxLife: life,
      r: rand(1, 3), color,
    });
  }
}

// ============ 射击 ============
function playerShoot() {
  if (player.triple > 0) {
    bullets.push({ x: player.x, y: player.y - 14, vx: 0, vy: -10, r: 4, color: '#4fc3f7' });
    bullets.push({ x: player.x - 10, y: player.y - 8, vx: -3, vy: -9.5, r: 4, color: '#4fc3f7' });
    bullets.push({ x: player.x + 10, y: player.y - 8, vx: 3, vy: -9.5, r: 4, color: '#4fc3f7' });
  } else {
    bullets.push({ x: player.x, y: player.y - 14, vx: 0, vy: -10, r: 4, color: '#4fc3f7' });
  }
  sfx.shoot();
}

// ============ 敌人生成 ============
const ENEMY_TYPES = {
  basic:  { r: 16, hp: 1, score: 100, speed: rand(1.2, 2), color: '#e53935', fire: false, drop: 0.10 },
  speedy: { r: 12, hp: 1, score: 150, speed: rand(2.5, 3.8), color: '#ff9800', fire: false, drop: 0.12 },
  tank:   { r: 22, hp: 4, score: 300, speed: 0.9, color: '#8e24aa', fire: true, drop: 0.30 },
};

function spawnEnemy(type) {
  const t = ENEMY_TYPES[type];
  enemies.push({
    type, x: rand(t.r, W - t.r), y: -t.r - 10,
    vx: type === 'speedy' ? rand(-0.8, 0.8) : rand(-0.5, 0.5),
    r: t.r, hp: t.hp, maxHp: t.hp, score: t.score, speed: t.speed,
    color: t.color, fire: t.fire, fireCd: rand(1000, 2500), isBoss: false,
    sway: rand(0, Math.PI * 2), swaySpeed: rand(1.5, 3),
  });
}

// ============ Boss ============
function spawnBoss() {
  bossActive = true;
  enemies.push({
    type: 'boss', x: W / 2, y: -60, vx: 0,
    r: 46, hp: 80 + wave * 15, maxHp: 80 + wave * 15,
    score: 3000, speed: 1.5, color: '#d500f9', fire: true,
    fireCd: 500, isBoss: true, phase: 0, phaseT: 0,
    sway: 0, swaySpeed: 1,
  });
  sfx.boss();
}

// ============ 波次逻辑 ============
function updateWave(dt) {
  if (bossActive) return;
  if (enemies.length === 0) {
    waveTimer += dt * 1000;
    if (waveTimer > 1800) {
      waveTimer = 0;
      if (wave % 5 === 0) {
        spawnBoss();
      } else {
        wave++;
        const count = 4 + Math.floor(wave * 1.2);
        for (let i = 0; i < count; i++) {
          const roll = Math.random();
          const type = roll < 0.55 ? 'basic' : (roll < 0.85 ? 'speedy' : 'tank');
          spawnEnemy(type);
        }
      }
    }
  }
}

// ============ 道具 ============
const POWERUP_TYPES = [
  { id: 'triple',  color: '#4fc3f7', label: '三向射击', w: 0.30 },
  { id: 'shield',  color: '#66bb6a', label: '护盾',     w: 0.25 },
  { id: 'life',    color: '#ef5350', label: '生命+1',   w: 0.15 },
  { id: 'bomb',    color: '#ffd54f', label: '炸弹+1',   w: 0.20 },
  { id: 'rapid',   color: '#ab47bc', label: '速射',     w: 0.10 },
];
function spawnPowerup(x, y) {
  powerups.push({ x, y, vy: 1.6, r: 12, type: POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)] });
}

// ============ 主更新 ============
let lastTime = 0;
function update(dt) {
  // 星空移动
  for (const s of stars) {
    s.y += s.v * 60 * dt;
    if (s.y > H) { s.y = -2; s.x = rand(0, W); }
  }

  // ===== 玩家移动 =====
  if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed * 60 * dt;
  if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed * 60 * dt;
  if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed * 60 * dt * 0.7;
  if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed * 60 * dt * 0.7;
  player.x = Math.max(player.r, Math.min(W - player.r, player.x));
  player.y = Math.max(player.r + 30, Math.min(H - player.r, player.y));

  // ===== 玩家射击 =====
  player.fireCd -= dt * 1000;
  const wantFire = autoFire || keys['Space'];
  if (wantFire && player.fireCd <= 0) {
    playerShoot();
    player.fireCd = player.triple > 0 ? player.fireRate * 0.7 : player.fireRate;
  }

  // 道具计时
  if (player.tripleT > 0) { player.tripleT -= dt * 1000; if (player.tripleT <= 0) player.triple = 0; }
  if (player.invuln > 0) player.invuln -= dt * 1000;

  // ===== 子弹 =====
  for (const b of bullets) {
    b.x += b.vx * 60 * dt;
    b.y += b.vy * 60 * dt;
  }
  bullets = bullets.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20);

  for (const b of enemyBullets) {
    b.x += b.vx * 60 * dt;
    b.y += b.vy * 60 * dt;
  }
  enemyBullets = enemyBullets.filter(b => b.y < H + 20);

  // ===== 敌人行为 =====
  for (const e of enemies) {
    e.y += e.speed * 60 * dt;
    if (e.type === 'speedy') e.x += Math.sin(e.sway) * e.swaySpeed * 30 * dt;
    else if (e.type !== 'boss') e.x += Math.sin(e.sway) * 0.8 * 60 * dt;
    e.sway += dt * e.swaySpeed;

    if (e.isBoss) {
      e.phaseT += dt * 1000;
      e.x = W / 2 + Math.sin(e.phaseT / 1000 * 1.2) * (W / 2 - 60);
      e.y = Math.min(e.y + e.speed * 20 * dt, 90);
      e.fireCd -= dt * 1000;
      if (e.fireCd <= 0) {
        e.fireCd = Math.max(400, 1300 - wave * 40);
        // Boss 弹幕：环形
        const n = 10 + Math.floor(wave / 3);
        for (let i = 0; i < n; i++) {
          const ang = (i / n) * Math.PI * 2 + e.phaseT / 500;
          enemyBullets.push({
            x: e.x, y: e.y + 20,
            vx: Math.cos(ang) * 2.2, vy: Math.sin(ang) * 2.2 + 0.6,
            r: 5, color: '#ff4081',
          });
        }
        sfx.enemyShoot();
      }
    } else if (e.fire) {
      e.fireCd -= dt * 1000;
      if (e.fireCd <= 0 && e.y > 0 && e.y < H * 0.6) {
        e.fireCd = rand(1500, 2800);
        const dx = player.x - e.x, dy = player.y - e.y;
        const d = Math.hypot(dx, dy) || 1;
        enemyBullets.push({ x: e.x, y: e.y + e.r, vx: dx / d * 2.6, vy: dy / d * 2.6, r: 4, color: '#ff5252' });
        sfx.enemyShoot();
      }
    }
  }

  // 敌人越界
  for (const e of enemies) {
    if (!e.isBoss && e.y - e.r > H + 30) {
      e.y = -e.r - 10;
      e.x = rand(e.r, W - e.r);
    }
  }

  // ===== 玩家子弹 vs 敌人 =====
  for (let bi = bullets.length - 1; bi >= 0; bi--) {
    const b = bullets[bi];
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      if (circleHit(b, e)) {
        bullets.splice(bi, 1);
        e.hp -= 1;
        spawnParticle(b.x, b.y, '#fff', 4, 0.3);
        if (e.hp <= 0) {
          if (e.isBoss) {
            // Boss 死亡
            score += e.score;
            bossActive = false;
            spawnExplosion(e.x, e.y, '#d500f9');
            spawnExplosion(e.x, e.y, '#ff4081');
            spawnExplosion(e.x, e.y, '#ffd54f');
            enemies.splice(ei, 1);
            wave++;
            sfx.boom();
            shake = 20;
            // 奖励道具
            spawnPowerup(e.x - 40, e.y);
            spawnPowerup(e.x + 40, e.y);
          } else {
            score += e.score;
            spawnExplosion(e.x, e.y, e.color);
            if (Math.random() < e.drop) spawnPowerup(e.x, e.y);
            enemies.splice(ei, 1);
            sfx.hit();
          }
        }
        break;
      }
    }
  }

  // ===== 敌人 vs 玩家 / 敌弹 vs 玩家 =====
  if (player.invuln <= 0) {
    for (const e of enemies) {
      if (circleHit(player, e)) {
        hurtPlayer(e.isBoss ? 2 : 1);
        if (e.isBoss) { /* Boss 不消失 */ }
        else { spawnExplosion(e.x, e.y, e.color); enemies.splice(enemies.indexOf(e), 1); }
        break;
      }
    }
    if (player.invuln <= 0) {
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        if (circleHit(player, enemyBullets[i])) {
          enemyBullets.splice(i, 1);
          hurtPlayer(1);
          if (player.invuln > 0) break;
        }
      }
    }
  }

  // ===== 道具拾取 =====
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += p.vy * 60 * dt;
    if (p.y > H + 20) { powerups.splice(i, 1); continue; }
    if (dist(player.x, player.y, p.x, p.y) < player.r + p.r + 6) {
      applyPowerup(p.type);
      spawnParticle(p.x, p.y, p.type.color, 10, 0.6);
      powerups.splice(i, 1);
      sfx.power();
    }
  }

  // ===== 粒子 =====
  for (const p of particles) {
    p.x += p.vx * 60 * dt;
    p.y += p.vy * 60 * dt;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  if (shake > 0) shake -= 60 * dt;

  // 波次更新（非 Boss 时）
  updateWave(dt);
}

function applyPowerup(type) {
  switch (type.id) {
    case 'triple': player.triple = 1; player.tripleT = 8000; break;
    case 'shield': player.shield = 1; break;
    case 'life': player.lives = Math.min(6, player.lives + 1); break;
    case 'bomb': player.bomb = Math.min(3, player.bomb + 1); break;
    case 'rapid': player.fireRate = Math.max(90, player.fireRate - 40); break;
  }
}

function hurtPlayer(dmg = 1) {
  if (player.shield > 0) {
    player.shield = 0;
    spawnParticle(player.x, player.y, '#66bb6a', 14, 0.6);
    player.invuln = 1500;
    sfx.hurt();
    return;
  }
  player.lives -= dmg;
  player.invuln = 2000;
  sfx.hurt();
  shake = 10;
  spawnExplosion(player.x, player.y, '#4fc3f7');
  if (player.lives <= 0) gameOver();
}

// ============ 绘制 ============
function drawPlayer() {
  ctx.save();
  ctx.translate(player.x, player.y);

  // 护盾
  if (player.shield > 0) {
    ctx.beginPath();
    ctx.arc(0, 0, player.r + 12, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(102, 213, 106, 0.6)';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, player.r + 12, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(102, 213, 106, 0.12)';
    ctx.fill();
  }

  // 无敌闪烁
  if (player.invuln > 0 && Math.floor(performance.now() / 90) % 2 === 0) {
    ctx.restore();
    return;
  }

  // 飞船主体
  ctx.beginPath();
  ctx.moveTo(0, -20);
  ctx.lineTo(14, 14);
  ctx.lineTo(0, 8);
  ctx.lineTo(-14, 14);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, -20, 0, 14);
  grad.addColorStop(0, '#4fc3f7');
  grad.addColorStop(1, '#1565c0');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#e1f5fe';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 引擎火焰
  ctx.beginPath();
  ctx.moveTo(-6, 12);
  ctx.lineTo(0, 12 + rand(8, 16));
  ctx.lineTo(6, 12);
  ctx.fillStyle = '#ffd54f';
  ctx.fill();
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);

  if (e.isBoss) {
    // Boss 绘制：六边形 + 核心
    const pulse = Math.sin(e.phaseT / 300) * 3;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const ang = (i / 6) * Math.PI * 2 + Math.PI / 6;
      const rr = e.r + pulse;
      const px = Math.cos(ang) * rr, py = Math.sin(ang) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(213, 0, 249, 0.25)';
    ctx.fill();
    ctx.strokeStyle = '#d500f9';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, e.r * 0.45, 0, Math.PI * 2);
    ctx.fillStyle = '#ff4081';
    ctx.fill();

    // Boss 血条
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(W / 2 - 150, 14, 300, 12);
    ctx.fillStyle = '#ff4081';
    ctx.fillRect(W / 2 - 150, 14, 300 * (e.hp / e.maxHp), 12);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.strokeRect(W / 2 - 150, 14, 300, 12);
    return;
  }

  // 普通敌人
  ctx.rotate(e.sway * 0.3);
  ctx.beginPath();
  if (e.type === 'speedy') {
    // 三角
    ctx.moveTo(0, 14);
    ctx.lineTo(-12, -10);
    ctx.lineTo(12, -10);
  } else if (e.type === 'tank') {
    // 六角
    for (let i = 0; i < 6; i++) {
      const ang = (i / 6) * Math.PI * 2;
      const px = Math.cos(ang) * e.r, py = Math.sin(ang) * e.r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
  } else {
    // 菱形
    ctx.moveTo(0, 14);
    ctx.lineTo(-14, 0);
    ctx.lineTo(0, -14);
    ctx.lineTo(14, 0);
  }
  ctx.closePath();
  ctx.fillStyle = e.color;
  ctx.fill();
  ctx.strokeStyle = '#ffd54f';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 血条（多血敌人）
  if (e.maxHp > 1) {
    ctx.rotate(-e.sway * 0.3);
    const w = e.r * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(-w / 2, -e.r - 10, w, 4);
    ctx.fillStyle = '#ffd54f';
    ctx.fillRect(-w / 2, -e.r - 10, w * (e.hp / e.maxHp), 4);
  }
  ctx.restore();
}

function drawPowerup(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(performance.now() / 400);
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const ang = (i / 5) * Math.PI * 2 - Math.PI / 2;
    const px = Math.cos(ang) * p.r, py = Math.sin(ang) * p.r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = p.type.color;
  ctx.globalAlpha = 0.85;
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();
}

function drawHUD() {
  // 分数
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px "Segoe UI", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('分数 ' + score, 16, 34);

  // 波次
  ctx.textAlign = 'center';
  ctx.font = 'bold 18px "Segoe UI", sans-serif';
  ctx.fillStyle = '#9aa7c8';
  ctx.fillText('第 ' + wave + ' 波' + (bossActive ? '  ⚠ BOSS' : ''), W / 2, 34);

  // 生命
  ctx.textAlign = 'right';
  ctx.font = '20px sans-serif';
  let hearts = '';
  for (let i = 0; i < player.lives; i++) hearts += '❤️ ';
  ctx.fillText(hearts.trim(), W - 16, 34);

  // 炸弹
  ctx.font = '16px sans-serif';
  ctx.fillStyle = '#ffd54f';
  ctx.fillText('💣 ×' + player.bomb + '  (X)', W - 16, 58);

  // 道具状态
  let line = 1;
  if (player.triple > 0) {
    ctx.fillStyle = '#4fc3f7';
    ctx.fillText('✦ 三向射击 ' + Math.ceil(player.tripleT / 1000) + 's', W - 16, 58 + line * 20);
    line++;
  }
  if (player.shield > 0) {
    ctx.fillStyle = '#66bb6a';
    ctx.fillText('🛡 护盾', W - 16, 58 + line * 20);
    line++;
  }
}

// ============ 主绘制 ============
function draw() {
  ctx.save();
  // 震屏
  if (shake > 0) {
    ctx.translate(rand(-shake, shake) * 0.4, rand(-shake, shake) * 0.4);
  }

  // 星空
  ctx.fillStyle = '#0d1226';
  ctx.fillRect(-10, -10, W + 20, H + 20);
  for (const s of stars) {
    ctx.globalAlpha = Math.min(1, s.s);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // 道具
  for (const p of powerups) drawPowerup(p);

  // 子弹
  for (const b of bullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 10;
    ctx.fill();
  }
  for (const b of enemyBullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 8;
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // 敌人
  for (const e of enemies) drawEnemy(e);

  // 玩家
  if (state === STATE.PLAYING || state === STATE.PAUSED) drawPlayer();

  // 粒子
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // HUD（不受震屏影响）
  if (state === STATE.PLAYING || state === STATE.PAUSED) drawHUD();
}

// ============ 主循环 ============
function loop(ts) {
  const dt = Math.min(0.033, (ts - lastTime) / 1000 || 0.016);
  lastTime = ts;

  if (state === STATE.PLAYING) update(dt);
  draw();
  requestAnimationFrame(loop);
}

// 自动聚焦键盘事件
window.addEventListener('keydown', initAudio, { once: true });

// 启动
resetGame();
initStars();
requestAnimationFrame(loop);
</script>
